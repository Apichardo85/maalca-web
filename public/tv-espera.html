  var q=new URLSearchParams(location.search), target=q.get('url');
  try{ if(target) localStorage.setItem('maalca_tv_target',target); else target=localStorage.getItem('maalca_tv_target'); }catch(e){}
  // Nombre del negocio a partir del slug (/la-catrina-elmira/board -> "La Catrina Elmira").
  try{
    var seg=new URL(target).pathname.split('/').filter(Boolean)[0]||'';
    if(seg && seg!=='space') document.getElementById('biz').textContent=seg.replace(/-/g,' ');
  }catch(e){}
  if(!target){ document.getElementById('sub').textContent='Abre el link de la pantalla desde Fully Kiosk.'; return; }
  var busy=false;
  function check(){
    if(busy) return; busy=true;
    var c=new AbortController(), t=setTimeout(function(){c.abort()},6000);
    // no-cors: basta con que el servidor responda (respuesta opaca) para saber que hay Internet.
    fetch(target,{mode:'no-cors',cache:'no-store',signal:c.signal})
      .then(function(){ location.replace(target); })
      .catch(function(){ busy=false; })
      .then(function(){ clearTimeout(t); });
  }
  check(); setInterval(check,4000);
  window.addEventListener('online',check);
})();
</script>
</body></html>
