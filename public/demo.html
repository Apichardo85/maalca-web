<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MaalCa · Demo de Pantallas</title>
<style>
  :root { --blue:#045AFE; --bg:#0B1020; --card:#151C33; --text:#F4F6FF; --muted:#9AA4C7; color-scheme:only dark; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; overflow:hidden; background:var(--bg); }
  /* Lienzo fijo 1920x1080 escalado al tamaño real de la vista (igual que board y presentación):
     así no se corta ni se amplía aunque la TV/Fully Kiosk reporte un viewport raro. */
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0;
           background:radial-gradient(1200px 700px at 20% -10%, #14307a55, transparent), var(--bg);
           color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
           display:flex; flex-direction:column; align-items:center; justify-content:center; gap:56px; padding:60px 100px; }
  img.logo { width:520px; height:auto; }
  h1 { margin:0; font-size:64px; font-weight:700; letter-spacing:-.02em; text-align:center; }
  p.sub { margin:12px 0 0; color:var(--muted); font-size:32px; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:40px; width:100%; }
  a.btn { display:flex; flex-direction:column; gap:14px; background:var(--card); border:4px solid transparent;
          border-radius:32px; padding:44px 48px; color:var(--text); text-decoration:none; min-height:240px;
          justify-content:center; transition:transform .15s, border-color .15s, background .15s; }
  a.btn b { font-size:44px; }
  a.btn span { color:var(--muted); font-size:28px; line-height:1.35; }
  /* Foco visible para el control remoto (D-pad) */
  a.btn:focus, a.btn:hover { outline:none; border-color:var(--blue); background:#1B2547; transform:scale(1.04); }
  a.btn.off { opacity:.45; pointer-events:none; }
  .hint { margin:0; color:var(--muted); font-size:24px; text-align:center; }
</style>
</head>
<body>
<div id="stage">
  <img class="logo" src="/logo/maalca-full-dark.png" alt="MaalCa">
  <div>
    <h1>Pantallas MaalCa</h1>
    <p class="sub">Elige qué quieres mostrar</p>
  </div>
  <nav class="grid" id="links"></nav>
  <p class="hint">Usa las flechas del control para moverte y OK para abrir · Atrás para volver a este menú</p>
</div>

<script>
/* ──────────────────────────────────────────────────────────────
   CONFIGURACIÓN — edita solo esta lista.
   url vacío ("") = botón deshabilitado (aún no configurado).
   La presentación abre en modo presentar (/present); el archivo debe estar
   compartido como "cualquiera con el enlace".
   ────────────────────────────────────────────────────────────── */
var LINKS = [
  { title:"Menú en vivo · La Catrina", desc:"Pantalla real, diseño Platos flotantes", url:"/la-catrina-elmira/board" },
  { title:"Presentación", desc:"Qué son las Pantallas MaalCa", url:"/presentacion.html" },
  { title:"Cómo se edita el menú", desc:"El panel donde el dueño cambia platos y precios", url:"/space/la-catrina-elmira/catalog" }
];
function fit(){var st=document.getElementById('stage'),k=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform='scale('+k+')';st.style.left=((innerWidth-1920*k)/2)+'px';st.style.top=((innerHeight-1080*k)/2)+'px';}
addEventListener('resize',fit);fit();
var nav = document.getElementById('links');
LINKS.forEach(function (l, i) {
  var a = document.createElement('a');
  a.className = 'btn' + (l.url ? '' : ' off');
  if (l.url) a.href = l.url;
  a.setAttribute('tabindex', l.url ? '0' : '-1');
  a.innerHTML = '<b></b><span></span>';
  a.querySelector('b').textContent = l.title;
  a.querySelector('span').textContent = l.url ? l.desc : l.desc + ' (pendiente de configurar)';
  nav.appendChild(a);
  if (i === 0) setTimeout(function () { a.focus(); }, 50);
});
</script>
</body>
</html>
